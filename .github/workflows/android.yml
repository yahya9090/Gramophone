name: Android CI

on:
  push:
    branches: [ "beta", "compose-rewrite" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [ "beta", "compose-rewrite" ]
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set release type
        run: echo releaseType=CI > package.properties

      - name: Generate temporary signing key for Release build
        run: |
          mkdir -p ~/.gradle
          keytool -genkeypair -v -keystore ~/key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gramophone -storepass android123 -keypass android123 \
            -dname "CN=Gramophone, OU=Dev, O=Dev, L=City, S=State, C=US"
          echo "AKANE_RELEASE_STORE_FILE=$(realpath ~/key.jks)" > ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_STORE_PASSWORD=android123" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_ALIAS=gramophone" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_PASSWORD=android123" >> ~/.gradle/gradle.properties

      - name: Build Optimized Release & Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - name: Upload Optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Release-Optimized
          path: app/build/outputs/apk/release/*.apk
          compression-level: 9

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 9
          
